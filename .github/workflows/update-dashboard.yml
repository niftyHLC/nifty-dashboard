name: Daily Bhavcopy Update

on:
  repository_dispatch:
    types: [run-dashboard-update]
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests yfinance holidays

      - name: Run update script
        run: |
          python update.py

      - name: Check for changes and push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json bhavcopy.csv || true
          git diff --quiet && git diff --cached --quiet || git commit -m "Automated data update [skip ci]"
          git push
