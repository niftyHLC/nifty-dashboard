name: Daily Bhavcopy Update

on:
  repository_dispatch:
    types: [run-dashboard-update]

  workflow_dispatch:

  schedule:
    # IST window: 15:35 to 21:00, Monday-Friday.
    # GitHub cron uses UTC.
    - cron: '5-55/5 10 * * 1-5'   # 15:35-16:25 IST
    - cron: '*/5 11-14 * * 1-5'   # 16:30-20:25 IST
    - cron: '0-30/5 15 * * 1-5'   # 20:30-21:00 IST

concurrency:
  group: daily-bhavcopy-update
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests yfinance numpy scipy holidays

      - name: Check NSE Bhavcopy and update dashboard
        run: python update.py
