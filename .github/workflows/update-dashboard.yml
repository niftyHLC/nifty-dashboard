name: Daily Bhavcopy Update

on:
  schedule:
    # Runs every 15 minutes from 3:30 PM to 10:00 PM IST, Monday to Friday
    - cron: '0,15,30,45 10 * * 1-5'     # 3:30 PM to 4:15 PM IST
    - cron: '0,15,30,45 11-15 * * 1-5'  # 4:30 PM to 9:15 PM IST
    - cron: '0,15,30 16 * * 1-5'        # 9:30 PM to 10:00 PM IST
    
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests yfinance holidays

      - name: Run update script
        run: |
          python update.py

      - name: Check for changes and push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json bhavcopy.csv || true
          git diff --quiet && git diff --cached --quiet || git commit -m "Automated data update [skip ci]"
          git push
