name: Daily Bhavcopy Update

on:
  repository_dispatch:
    types: [run-dashboard-update]
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests yfinance numpy scipy holidays

      - name: Run update script and push changes
        run: |
          python update.py
