name: Daily Bhavcopy Update

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-bhavcopy-update
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests yfinance numpy scipy holidays

      - name: Wait for NSE Bhavcopy and update dashboard
        shell: bash
        run: |
          while true; do
            echo "[$(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M:%S IST')] Checking NSE Bhavcopy..."
            set +e
            python update.py
            code=$?
            set -e

            if [ "$code" -eq 0 ]; then
              echo "Update completed, already processed, or non-market day. Stopping."
              exit 0
            fi

            if [ "$code" -ne 75 ]; then
              echo "update.py failed with exit code $code"
              exit "$code"
            fi

            hour=$(TZ=Asia/Kolkata date +%H)
            minute=$(TZ=Asia/Kolkata date +%M)
            if [ "$hour" -gt 21 ] || { [ "$hour" -eq 21 ] && [ "$minute" -ge 0 ]; }; then
              echo "Reached 21:00 IST. Stopping cleanly."
              exit 0
            fi

            echo "Required market data not ready. Waiting 5 minutes..."
            sleep 300
          done
