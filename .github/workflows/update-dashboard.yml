name: Update Dashboard Data

on:
  schedule:
    # 3:30 PM IST
    - cron: '0 10 * * 1-5'
    
    # 5:00 PM to 9:00 PM IST (Excluding 7:15 PM and 8:15 PM IST)
    - cron: '30 11 * * 1-5'  # 5:00 PM IST
    - cron: '45 11 * * 1-5'  # 5:15 PM IST
    - cron: '0 12 * * 1-5'   # 5:30 PM IST
    - cron: '15 12 * * 1-5'  # 5:45 PM IST
    - cron: '30 12 * * 1-5'  # 6:00 PM IST
    - cron: '45 12 * * 1-5'  # 6:15 PM IST
    - cron: '0 13 * * 1-5'   # 6:30 PM IST
    - cron: '15 13 * * 1-5'  # 6:45 PM IST
    - cron: '30 13 * * 1-5'  # 7:00 PM IST
    - cron: '0 14 * * 1-5'   # 7:30 PM IST
    - cron: '15 14 * * 1-5'  # 7:45 PM IST
    - cron: '30 14 * * 1-5'  # 8:00 PM IST
    - cron: '0 15 * * 1-5'   # 8:30 PM IST
    - cron: '15 15 * * 1-5'  # 8:45 PM IST
    - cron: '30 15 * * 1-5'  # 9:00 PM IST

  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Fetch Market Data and Update JSON
        run: python update.py

      - name: Commit and Push Updated Data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chrono: automated data update [skip ci]"
          file_pattern: "data.json"
          commit_author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
