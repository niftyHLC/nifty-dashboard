name: Daily Bhavcopy Update

on:
  workflow_dispatch:

  schedule:
    # 15:35 IST = 10:05 UTC, Monday-Friday.
    # GitHub may start a scheduled job a little late; once started,
    # this single job checks NSE itself every 5 minutes until 21:00 IST.
    - cron: '5 10 * * 1-5'

concurrency:
  group: daily-bhavcopy-update
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests yfinance numpy scipy holidays

      - name: Wait for NSE Bhavcopy and update dashboard
        shell: bash
        run: |
          while true; do
            NOW_IST=$(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M:%S')
            echo "[$NOW_IST IST] Checking NSE Bhavcopy..."

            set +e
            python update.py
            CODE=$?
            set -e

            if [ "$CODE" -eq 0 ]; then
              echo "Update completed, already processed, or non-market day. Stopping."
              exit 0
            fi

            if [ "$CODE" -ne 75 ]; then
              echo "update.py failed with exit code $CODE."
              exit "$CODE"
            fi

            HOUR=$(TZ=Asia/Kolkata date +%H)
            MINUTE=$(TZ=Asia/Kolkata date +%M)

            if [ "$HOUR" -gt 21 ] || { [ "$HOUR" -eq 21 ] && [ "$MINUTE" -ge 0 ]; }; then
              echo "Reached 21:00 IST without a valid Bhavcopy. Stopping cleanly."
              exit 0
            fi

            echo "Required NSE data not ready. Waiting 5 minutes..."
            sleep 300
          done
